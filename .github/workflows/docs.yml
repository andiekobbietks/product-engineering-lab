name: Build documentation and check repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository integrity tests
        run: python -m unittest discover -s tests -v
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs build --strict
