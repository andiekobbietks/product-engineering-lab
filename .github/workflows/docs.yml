name: Build documentation and optionally deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy the built documentation (requires GitHub Pages to be enabled in repository settings)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run repository integrity tests
        run: python -m unittest discover -s tests -v
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt
      - name: Install Sand3D benchmark engine
        run: python -m pip install -r requirements-cad.txt
      - name: Generate full Sand3D assembly, source map and component GLBs
        run: |
          python experiments/001-nyfasi-reconstruction/scripts/build_reconstruction.py
          mkdir -p docs/assets/nyfasi-assembly
          cp experiments/001-nyfasi-reconstruction/output/nyfasi_complete_assembly.glb docs/assets/nyfasi-assembly/
          cp experiments/001-nyfasi-reconstruction/output/web-components/* docs/assets/nyfasi-assembly/
      - name: Generate live Nyfasi benchmark result
        run: |
          python experiments/001-nyfasi-reconstruction/benchmark/nyfasi_sand3d_benchmark.py --output docs/benchmarks/data/latest.json
      - name: Build documentation
        run: mkdocs build --strict
      - name: Install headless browser for gallery verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify interactive Sand3D gallery in Chromium
        run: python tests/test_gallery_browser.py --site site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
