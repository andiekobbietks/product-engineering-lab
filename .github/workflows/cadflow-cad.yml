name: CadFlow B-rep reconstruction
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/001-nyfasi-reconstruction/models/cad-parameters.json"
      - "experiments/001-nyfasi-reconstruction/scripts/build_cadflow_reconstruction.py"
      - ".github/workflows/cadflow-cad.yml"
permissions:
  contents: read
jobs:
  cadflow-brep:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence provenance
        run: python experiments/001-nyfasi-reconstruction/scripts/validate_provenance.py
      - name: Validate CAD parameter geometry constraints
        run: python experiments/001-nyfasi-reconstruction/scripts/validate_geometry.py
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev
      - name: Install matching OpenCascade runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cadquery-ocp==7.9.3.1"
      - name: Install pinned CadFlow source
        run: |
          python -m pip install --no-build-isolation "git+https://github.com/yhz5613813/CadFlow.git@43fbac0515a560229d700e07281cc5c08c3f9765"
      - name: Build and validate component B-reps
        run: python experiments/001-nyfasi-reconstruction/scripts/build_cadflow_reconstruction.py
      - name: Check expected exports
        run: |
          test -s experiments/001-nyfasi-reconstruction/output/cadflow/cadflow-build-manifest.json
          test "$(find experiments/001-nyfasi-reconstruction/output/cadflow -name '*.step' | wc -l)" -ge 15
          test "$(find experiments/001-nyfasi-reconstruction/output/cadflow -name '*.glb' | wc -l)" -ge 15
          test -s experiments/001-nyfasi-reconstruction/output/cadflow/nyfasi_research_assembly.step
          test -s experiments/001-nyfasi-reconstruction/output/cadflow/nyfasi_research_assembly.glb
      - name: Upload B-rep and preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyfasi-cadflow-brep
          path: experiments/001-nyfasi-reconstruction/output/cadflow/
          if-no-files-found: error
          retention-days: 30
