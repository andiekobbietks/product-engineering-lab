name: Sand3D Nyfasi engineering intelligence benchmark

on:
  push:
    branches: [main]
    paths:
      - "experiments/001-nyfasi-reconstruction/**"
      - "requirements-cad.txt"
      - ".github/workflows/sand3d-nyfasi-benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/001-nyfasi-reconstruction/**"
      - "requirements-cad.txt"
      - ".github/workflows/sand3d-nyfasi-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sand3d-nyfasi-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Install pinned Sand3D engine
        run: python -m pip install --upgrade pip -r requirements-cad.txt
      - name: Validate evidence provenance
        run: python experiments/001-nyfasi-reconstruction/scripts/validate_provenance.py
      - name: Validate baseline geometry constraints
        run: python experiments/001-nyfasi-reconstruction/scripts/validate_geometry.py
      - name: Run Sand3D parametric edit benchmark
        run: python experiments/001-nyfasi-reconstruction/benchmark/nyfasi_sand3d_benchmark.py --output experiments/001-nyfasi-reconstruction/benchmark/results/latest.json
      - name: Build reference assembly for the viewer
        run: python experiments/001-nyfasi-reconstruction/scripts/build_reconstruction.py
      - name: Stage benchmark result for documentation
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/benchmarks/data
          cp experiments/001-nyfasi-reconstruction/benchmark/results/latest.json docs/benchmarks/data/latest.json
      - name: Upload benchmark and Sand3D outputs
        uses: actions/upload-artifact@v4
        with:
          name: nyfasi-sand3d-engineering-benchmark
          path: |
            experiments/001-nyfasi-reconstruction/benchmark/results/latest.json
            experiments/001-nyfasi-reconstruction/output/*
          if-no-files-found: error
          retention-days: 30
