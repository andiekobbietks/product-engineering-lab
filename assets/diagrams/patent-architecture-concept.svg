<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Patent-disclosed hair applicator architecture, conceptual exploded view</title>
<desc id="desc">Original conceptual diagram showing upper and lower housing portions, reservoir, roller, slotted wall and eight comb teeth. Not to scale and not official product CAD.</desc>
<defs>
  <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d9e3ec"/><stop offset="1" stop-color="#8799aa"/></linearGradient>
  <linearGradient id="roller" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8c989f"/><stop offset="1" stop-color="#38434c"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#62c6b2"/></marker>
  <style>
    .bg{fill:#101827}.title{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#cbd5e1}.label{font:700 19px Arial,sans-serif;fill:#f8fafc}.small{font:14px Arial,sans-serif;fill:#cbd5e1}.note{font:15px Arial,sans-serif;fill:#f6c56f}.call{stroke:#62c6b2;stroke-width:2;fill:none;marker-end:url(#arrow)}.line{stroke:#94a3b8;stroke-width:1.5;fill:none}
  </style>
</defs>
<rect class="bg" width="1400" height="820" rx="24"/>
<text x="60" y="65" class="title">PATENT-DISCLOSED HAIR APPLICATOR ARCHITECTURE</text>
<text x="60" y="98" class="sub">Conceptual exploded view reconstructed from GB2591502A / CN115003190B descriptions · not to scale</text>
<!-- upper housing -->
<g transform="translate(150 135)">
  <path d="M0 28 L70 0 L430 0 L500 28 L430 62 L70 62 Z" fill="url(#shell)" stroke="#e5edf5" stroke-width="2"/>
  <path d="M0 28 L0 62 L70 95 L430 95 L500 62 L500 28 L430 62 L70 62 Z" fill="#718496" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="43" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#14202c">UPPER HOUSING</text>
</g>
<path d="M400 235 L400 260" class="call"/>
<!-- reservoir -->
<g transform="translate(210 270)">
  <path d="M0 18 L55 0 L390 0 L445 18 L390 48 L55 48 Z" fill="#7fc4d2" fill-opacity=".85" stroke="#b7edf3" stroke-width="2"/>
  <path d="M0 18 L0 72 L55 102 L390 102 L445 72 L445 18 L390 48 L55 48 Z" fill="#4b9dad" fill-opacity=".8" stroke="#b7edf3" stroke-width="2"/>
  <text x="222" y="67" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10212a">RESERVOIR VOLUME</text>
</g>
<path d="M430 375 L430 402" class="call"/>
<!-- roller -->
<g transform="translate(220 420)">
  <rect x="20" y="0" width="425" height="54" rx="27" fill="url(#roller)" stroke="#dbe4ea" stroke-width="2"/>
  <ellipse cx="20" cy="27" rx="15" ry="27" fill="#66747d" stroke="#dbe4ea" stroke-width="2"/>
  <ellipse cx="445" cy="27" rx="15" ry="27" fill="#303b43" stroke="#dbe4ea" stroke-width="2"/>
  <g fill="#cbd5e1" opacity=".8"><rect x="92" y="3" width="28" height="48" rx="12"/><rect x="180" y="3" width="28" height="48" rx="12"/><rect x="268" y="3" width="28" height="48" rx="12"/><rect x="356" y="3" width="28" height="48" rx="12"/></g>
  <text x="232" y="88" text-anchor="middle" class="small">ROLLER DRUM + END PINS (schematic)</text>
</g>
<path d="M430 525 L430 548" class="call"/>
<!-- slotted wall -->
<g transform="translate(195 565)">
  <rect x="0" y="0" width="500" height="22" rx="5" fill="#d6dce3" stroke="#f8fafc" stroke-width="2"/>
  <g fill="#101827">
    <rect x="62" y="-2" width="14" height="27" rx="5"/><rect x="125" y="-2" width="14" height="27" rx="5"/><rect x="188" y="-2" width="14" height="27" rx="5"/><rect x="251" y="-2" width="14" height="27" rx="5"/><rect x="314" y="-2" width="14" height="27" rx="5"/><rect x="377" y="-2" width="14" height="27" rx="5"/><rect x="440" y="-2" width="14" height="27" rx="5"/>
  </g>
  <text x="250" y="56" text-anchor="middle" class="small">CURVED WALL SHOWN AS FLAT SLOT CARRIER</text>
</g>
<!-- teeth -->
<g transform="translate(240 640)" fill="#e4e9ee" stroke="#f8fafc" stroke-width="1.5">
  <rect x="0" y="0" width="18" height="75" rx="8"/><rect x="55" y="0" width="18" height="75" rx="8"/><rect x="110" y="0" width="18" height="75" rx="8"/><rect x="165" y="0" width="18" height="75" rx="8"/><rect x="220" y="0" width="18" height="75" rx="8"/><rect x="275" y="0" width="18" height="75" rx="8"/><rect x="330" y="0" width="18" height="75" rx="8"/><rect x="385" y="0" width="18" height="75" rx="8"/>
</g>
<text x="440" y="745" text-anchor="middle" class="small">EIGHT BLADE-LIKE TEETH IN THE ILLUSTRATED PATENT EMBODIMENT</text>
<!-- lower housing base -->
<g transform="translate(760 595)">
  <path d="M0 28 L60 0 L430 0 L490 28 L430 60 L60 60 Z" fill="url(#shell)" stroke="#e5edf5" stroke-width="2"/>
  <path d="M0 28 L0 75 L60 108 L430 108 L490 75 L490 28 L430 60 L60 60 Z" fill="#718496" stroke="#cbd5e1" stroke-width="2"/>
  <text x="245" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#14202c">LOWER HOUSING</text>
</g>
<!-- labels -->
<g>
  <path d="M660 170 L780 170" class="line"/><text x="800" y="176" class="label">Upper housing / lid</text><text x="800" y="201" class="small">Clamshell interface; snap-fit embodiment</text>
  <path d="M660 320 L780 320" class="line"/><text x="800" y="326" class="label">Reservoir</text><text x="800" y="351" class="small">Contains hair-treatment substance</text>
  <path d="M665 448 L780 448" class="line"/><text x="800" y="454" class="label">Rotatable roller</text><text x="800" y="479" class="small">Textured bands align with slots</text>
  <path d="M695 577 L780 577" class="line"/><text x="800" y="583" class="label">Wall + through-slots</text><text x="800" y="608" class="small">Patent describes a curved, cylindrical segment</text>
  <path d="M660 685 L780 685" class="line"/><text x="800" y="691" class="label">Comb teeth</text><text x="800" y="716" class="small">Eight in the illustrated embodiment</text>
  <path d="M1000 730 L1000 758 L1220 758" class="line"/><text x="1010" y="784" class="note">Conceptual only · not official CAD · not to scale</text>
</g>
</svg>