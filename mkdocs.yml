site_name: Product Engineering Lab
site_description: From product evidence to engineering intelligence.
site_url: https://andiekobbietks.github.io/product-engineering-lab/
repo_url: https://github.com/andiekobbietks/product-engineering-lab
repo_name: andiekobbietks/product-engineering-lab
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
nav:
  - Overview: index.md
  - Get started: getting-started.md
  - Research:
      - Vision: vision.md
      - Methodology: methodology.md
      - Architecture: architecture.md
      - Roadmap: roadmap.md
      - Nyfasi case study: experiments/nyfasi.md
      - Patent reading notes: experiments/patent-reading-notes.md
      - CAD parameter provenance: experiments/cad-parameter-provenance.md
      - Curved-wall geometry: experiments/curved-wall-geometry.md
      - CadFlow B-rep reconstruction: experiments/cadflow-reconstruction.md
      - Sand3D dataset and reuse policy: ../experiments/001-nyfasi-reconstruction/models/sand3d-dataset-policy.md
      - Sand3D datasets and demos: experiments/sand3d-dataset-strategy.md
      - China IP & manufacturing diligence: experiments/nyfasi-china-due-diligence.md
      - Validation protocol: experiments/nyfasi-validation.md
      - Image inventory: experiments/image-inventory.md
      - Interactive assembly explorer: experiments/assembly-explorer.md
      - Interactive 3D viewer: experiments/viewer.md
  - Commercial:
      - IP register: ip-register.md
      - Commercial proposal: commercial-proposal.md
      - Licensing status: licensing.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
